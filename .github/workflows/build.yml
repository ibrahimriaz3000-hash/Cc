name: IOSConnectCluster Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iosconnectcluster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Find Android project folder
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find . -maxdepth 6 -type f -name 'settings.gradle' \
            -not -path './.git/*' -not -path '*/build/*' -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle was not found."
            echo "Make sure the Android project files are committed to this repository."
            exit 1
          fi

          PROJECT_DIR="${SETTINGS_FILE%/*}"
          [[ "$PROJECT_DIR" == "$SETTINGS_FILE" ]] && PROJECT_DIR="."

          if [[ ! -f "$PROJECT_DIR/build.gradle" || \
                ! -f "$PROJECT_DIR/app/build.gradle" || \
                ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]]; then
            echo "ERROR: The Gradle project was found, but required Android files are missing."
            echo "Detected project folder: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project folder: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" :app:assembleDebug \
            --no-daemon --stacktrace --warning-mode all 2>&1 | tee gradle-build.log

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"
          APK_FILE="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [[ -z "$APK_FILE" || ! -s "$APK_FILE" ]]; then
            echo "ERROR: Gradle finished but no non-empty debug APK was found."
            exit 1
          fi

          echo "Build successful: $APK_FILE"
          ls -lh "$APK_FILE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: IOSConnectCluster-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle log if build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: IOSConnectCluster-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
          
